<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Piano Touch Game</title>

  <link
    rel="stylesheet"
    href="./css/style.css"
  />

  <link
    rel="stylesheet"
    href="./css/game.css"
  />

  <link
    rel="stylesheet"
    href="./css/keyboard.css"
  />
</head>

<body>

  <main>

    <h1>
      Piano Touch Game
    </h1>


    <!-- =========================
         SONG SELECTION
    ========================== -->

    <div class="song-selector">

      <p class="song-selector-title">
        Select Song
      </p>

      <div class="song-options">

        <label class="song-option">
          <input
            type="radio"
            name="song"
            value="outbyte"
            checked
          />

          <span>
            Outbyte
          </span>
        </label>


        <label class="song-option">
          <input
            type="radio"
            name="song"
            value="shadows-behind-neon"
          />

          <span>
            Shadows Behind Neon
          </span>
        </label>


        <label class="song-option">
          <input
            type="radio"
            name="song"
            value="galactic-spiritual-journey"
          />

          <span>
            Galactic Spiritual Journey
          </span>
        </label>

      </div>

    </div>


    <!-- =========================
         DIFFICULTY SELECTION
    ========================== -->

    <div class="difficulty-selector">

      <p class="difficulty-title">
        Select Difficulty
      </p>

      <div class="difficulty-options">

        <label>
          <input
            type="radio"
            name="difficulty"
            value="easy"
            checked
          />

          <span>
            Easy
          </span>
        </label>


        <label>
          <input
            type="radio"
            name="difficulty"
            value="medium"
          />

          <span>
            Medium
          </span>
        </label>


        <label>
          <input
            type="radio"
            name="difficulty"
            value="hard"
          />

          <span>
            Hard
          </span>
        </label>

      </div>

    </div>


    <!-- =========================
         PLAYER DETAILS
    ========================== -->

    <div class="player-details">

      <label for="playerName">
        Player Name
      </label>

      <input
        id="playerName"
        type="text"
        maxlength="20"
        placeholder="Enter your name"
        autocomplete="off"
      />

    </div>


    <!-- =========================
         START BUTTON
    ========================== -->

    <button
      id="startBtn"
      type="button"
    >
      Start Game
    </button>


    <!-- =========================
         GAME AREA
    ========================== -->

    <section
      id="gameArea"
      class="hidden"
    >

      <p>
        Now playing:
      </p>

      <h2 id="targetNote">
        Practice Song
      </h2>


      <!-- =========================
           GAME OVER MODAL
      ========================== -->

      <section
        id="gameOverModal"
        class="game-over-modal hidden"
        aria-label="Game over results"
      >

        <div class="game-over-card">

          <h2>
            Game Over
          </h2>

          <div
            id="resultStars"
            class="result-stars"
          ></div>

          <p
            id="resultMessage"
            class="result-message"
          ></p>

          <div class="result-stats">

            <p>
              Score:
              <strong id="finalScore">
                0
              </strong>
            </p>

            <p>
              Perfect:
              <strong id="finalPerfect">
                0
              </strong>
            </p>

            <p>
              Good:
              <strong id="finalGood">
                0
              </strong>
            </p>

            <p>
              Miss:
              <strong id="finalMiss">
                0
              </strong>
            </p>

            <p>
              Accuracy:
              <strong id="finalAccuracy">
                0%
              </strong>
            </p>

            <p>
              Highest Combo:
              <strong id="finalCombo">
                ×0
              </strong>
            </p>

            <p>
              Average Timing Error:
              <strong id="finalTimingError">
                0.00s
              </strong>
            </p>

          </div>

          <div class="game-over-actions">

            <button
              id="playAgainBtn"
              type="button"
            >
              Play Again
            </button>

            <button
              id="resultsLeaderboardBtn"
              type="button"
            >
              View Leaderboard
            </button>

          </div>

        </div>

      </section>


      <!-- =========================
           SCOREBOARD
      ========================== -->

      <div class="scoreboard">

        <div class="stat-card">

          <span class="stat-label">
            Score
          </span>

          <span
            class="stat-value"
            id="scoreValue"
          >
            0
          </span>

        </div>


        <div class="stat-card">

          <span class="stat-label">
            Time
          </span>

          <span
            class="stat-value"
            id="timeValue"
          >
            90s
          </span>

        </div>


        <div class="stat-card">

          <span class="stat-label">
            Accuracy
          </span>

          <span
            class="stat-value"
            id="accuracyValue"
          >
            100%
          </span>

        </div>


        <div class="stat-card">

          <span class="stat-label">
            Combo
          </span>

          <span
            class="stat-value"
            id="comboValue"
          >
            ×0
          </span>

        </div>

      </div>


      <!-- =========================
           GAME CONTROLS
      ========================== -->

      <div class="game-controls">

        <button
          id="pauseBtn"
          class="pause-btn"
          type="button"
          aria-label="Pause game"
        >
          Pause
        </button>

      </div>


      <!-- =========================
           FALLING NOTE HIGHWAY
      ========================== -->

      <div
        id="noteHighway"
        class="note-highway"
        aria-label="Falling note play area"
      >

        <div
          class="hit-line"
          aria-hidden="true"
        ></div>

      </div>


      <!-- =========================
           TWO-OCTAVE PIANO
      ========================== -->

      <div
        id="keyboard"
        class="keyboard"
        aria-label="Two octave piano keyboard"
      >

        <!-- WHITE KEYS -->

        <div class="white-keys">

          <button
            class="key white-key"
            type="button"
            data-note="C4"
            aria-label="C4"
          >
            <span>
              C4
            </span>
          </button>

          <button
            class="key white-key"
            type="button"
            data-note="D4"
            aria-label="D4"
          >
            <span>
              D4
            </span>
          </button>

          <button
            class="key white-key"
            type="button"
            data-note="E4"
            aria-label="E4"
          >
            <span>
              E4
            </span>
          </button>

          <button
            class="key white-key"
            type="button"
            data-note="F4"
            aria-label="F4"
          >
            <span>
              F4
            </span>
          </button>

          <button
            class="key white-key"
            type="button"
            data-note="G4"
            aria-label="G4"
          >
            <span>
              G4
            </span>
          </button>

          <button
            class="key white-key"
            type="button"
            data-note="A4"
            aria-label="A4"
          >
            <span>
              A4
            </span>
          </button>

          <button
            class="key white-key"
            type="button"
            data-note="B4"
            aria-label="B4"
          >
            <span>
              B4
            </span>
          </button>

          <button
            class="key white-key"
            type="button"
            data-note="C5"
            aria-label="C5"
          >
            <span>
              C5
            </span>
          </button>

          <button
            class="key white-key"
            type="button"
            data-note="D5"
            aria-label="D5"
          >
            <span>
              D5
            </span>
          </button>

          <button
            class="key white-key"
            type="button"
            data-note="E5"
            aria-label="E5"
          >
            <span>
              E5
            </span>
          </button>

          <button
            class="key white-key"
            type="button"
            data-note="F5"
            aria-label="F5"
          >
            <span>
              F5
            </span>
          </button>

          <button
            class="key white-key"
            type="button"
            data-note="G5"
            aria-label="G5"
          >
            <span>
              G5
            </span>
          </button>

          <button
            class="key white-key"
            type="button"
            data-note="A5"
            aria-label="A5"
          >
            <span>
              A5
            </span>
          </button>

          <button
            class="key white-key"
            type="button"
            data-note="B5"
            aria-label="B5"
          >
            <span>
              B5
            </span>
          </button>

        </div>


        <!-- BLACK KEYS -->

        <div class="black-keys">

          <button
            class="key black-key"
            type="button"
            data-note="C#4"
            aria-label="C sharp 4"
          >
            <span>
              C♯4
            </span>
          </button>

          <button
            class="key black-key"
            type="button"
            data-note="D#4"
            aria-label="D sharp 4"
          >
            <span>
              D♯4
            </span>
          </button>

          <button
            class="key black-key"
            type="button"
            data-note="F#4"
            aria-label="F sharp 4"
          >
            <span>
              F♯4
            </span>
          </button>

          <button
            class="key black-key"
            type="button"
            data-note="G#4"
            aria-label="G sharp 4"
          >
            <span>
              G♯4
            </span>
          </button>

          <button
            class="key black-key"
            type="button"
            data-note="A#4"
            aria-label="A sharp 4"
          >
            <span>
              A♯4
            </span>
          </button>

          <button
            class="key black-key"
            type="button"
            data-note="C#5"
            aria-label="C sharp 5"
          >
            <span>
              C♯5
            </span>
          </button>

          <button
            class="key black-key"
            type="button"
            data-note="D#5"
            aria-label="D sharp 5"
          >
            <span>
              D♯5
            </span>
          </button>

          <button
            class="key black-key"
            type="button"
            data-note="F#5"
            aria-label="F sharp 5"
          >
            <span>
              F♯5
            </span>
          </button>

          <button
            class="key black-key"
            type="button"
            data-note="G#5"
            aria-label="G sharp 5"
          >
            <span>
              G♯5
            </span>
          </button>

          <button
            class="key black-key"
            type="button"
            data-note="A#5"
            aria-label="A sharp 5"
          >
            <span>
              A♯5
            </span>
          </button>

        </div>

      </div>


      <!-- =========================
           TIMING JUDGEMENT
      ========================== -->

      <div
        id="judgement"
        class="judgement"
        aria-live="polite"
      ></div>


      <!-- =========================
           GAMEPLAY FEEDBACK
      ========================== -->

      <p
        id="feedback"
        aria-live="polite"
      ></p>

    </section>


    <!-- =========================
         LEADERBOARD BUTTON
    ========================== -->

    <button
      id="leaderboardBtn"
      class="leaderboard-btn"
      type="button"
    >
      View Leaderboard
    </button>


    <!-- =========================
         LEADERBOARD MODAL
    ========================== -->

    <section
      id="leaderboardSection"
      class="leaderboard-section hidden"
      aria-label="Leaderboard"
    >

      <div class="leaderboard-header">

        <h2>
          Leaderboard
        </h2>

        <button
          id="closeLeaderboardBtn"
          class="close-leaderboard-btn"
          type="button"
          aria-label="Close leaderboard"
        >
          ×
        </button>

      </div>

      <p id="leaderboardDifficulty">
        Easy Rankings
      </p>

      <div class="leaderboard-table-wrapper">

        <table class="leaderboard-table">

          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th>Score</th>
              <th>Accuracy</th>
              <th>Combo</th>
            </tr>
          </thead>

          <tbody id="leaderboardBody">
          </tbody>

        </table>

      </div>

    </section>

  </main>


  <!-- =========================
       TONE.JS
  ========================== -->

  <script
    src="https://unpkg.com/tone@latest/build/Tone.js"
  ></script>


  <!-- =========================
       MAIN GAME ENTRY POINT
  ========================== -->

  <script
    type="module"
    src="./js/script.js"
  ></script>

</body>

</html>
