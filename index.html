<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Piano Touch Game</title>

  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/game.css" />
  <link rel="stylesheet" href="./css/keyboard.css" />
</head>

<body>
  <main>
    <h1>Piano Touch Game</h1>

    <button id="startBtn" type="button">
      Start Game
    </button>

    <section id="gameArea" class="hidden">
      <p>Tap this note:</p>
      <h2 id="targetNote">C4</h2>

      <div class="scoreboard">
        <div class="stat-card">
          <span class="stat-label">Score</span>
          <span class="stat-value" id="scoreValue">0</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">Time</span>
          <span class="stat-value" id="timeValue">30s</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">Accuracy</span>
          <span class="stat-value" id="accuracyValue">100%</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">Combo</span>
          <span class="stat-value" id="comboValue">×0</span>
        </div>
      </div>

      <!-- Falling-note play area -->
      <div
        id="noteHighway"
        class="note-highway"
        aria-label="Falling note play area"
      >
        <div
          class="hit-line"
          aria-hidden="true"
        ></div>
      </div>

      <!-- Piano keyboard -->
      <div
        class="keyboard"
        aria-label="Piano keyboard"
      >
        <button
          class="key white-key"
          type="button"
          data-note="C4"
        >
          <span>C</span>
        </button>

        <button
          class="key black-key black-key-c-sharp"
          type="button"
          data-note="C#4"
        >
          <span>C♯</span>
        </button>

        <button
          class="key white-key"
          type="button"
          data-note="D4"
        >
          <span>D</span>
        </button>

        <button
          class="key black-key black-key-d-sharp"
          type="button"
          data-note="D#4"
        >
          <span>D♯</span>
        </button>

        <button
          class="key white-key"
          type="button"
          data-note="E4"
        >
          <span>E</span>
        </button>

        <button
          class="key white-key"
          type="button"
          data-note="F4"
        >
          <span>F</span>
        </button>

        <button
          class="key black-key black-key-f-sharp"
          type="button"
          data-note="F#4"
        >
          <span>F♯</span>
        </button>

        <button
          class="key white-key"
          type="button"
          data-note="G4"
        >
          <span>G</span>
        </button>

        <button
          class="key black-key black-key-g-sharp"
          type="button"
          data-note="G#4"
        >
          <span>G♯</span>
        </button>

        <button
          class="key white-key"
          type="button"
          data-note="A4"
        >
          <span>A</span>
        </button>

        <button
          class="key black-key black-key-a-sharp"
          type="button"
          data-note="A#4"
        >
          <span>A♯</span>
        </button>

        <button
          class="key white-key"
          type="button"
          data-note="B4"
        >
          <span>B</span>
        </button>

        <button
          class="key white-key"
          type="button"
          data-note="C5"
        >
          <span>C</span>
        </button>
      </div>

      <!-- Timing judgement and player feedback -->
      <div
        id="judgement"
        class="judgement"
        aria-live="polite"
      ></div>

      <p id="feedback"></p>
    </section>
  </main>

  <script src="https://unpkg.com/tone@latest/build/Tone.js"></script>
  <script type="module" src="./js/script.js"></script>
</body>
</html>
